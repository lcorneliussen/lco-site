name: Sync contribution status

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-status
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check upstream pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-contribution-status.mjs

      - name: Commit accepted contributions
        run: |
          if git diff --quiet -- src/data/contribution-status.json; then
            echo "No contribution status changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contribution-status.json
          git commit -m "Mark accepted upstream contribution"
          git push
